[project]
name = "uzex-pipeline"
version = "0.1.0"
description = "Cleans the exchange registry CSVs and loads them into Postgres (local or Supabase)."
requires-python = ">=3.12"
dependencies = ["pandas>=2.3", "psycopg[binary]>=3.3.6"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
